name: AI Automation Agent

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  issues:
    types: [opened, edited]
  schedule:
    - cron: '0 * * * *'

jobs:
  automate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Auto-Review PR
        if: github.event_name == 'pull_request'
        run: npm run pr-review --if-present

      - name: Auto-Generate Docs
        run: npm run generate-docs --if-present

      - name: Auto-Optimize Code
        run: npm run optimize --if-present

      - name: Auto-Triage Issues
        if: github.event_name == 'issues'
        run: npm run issue-triage --if-present
