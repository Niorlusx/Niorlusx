name: AI Automation Agent

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  issues:
    types: [opened, edited]
  schedule:
    - cron: '0 * * * *'

jobs:
  automate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8

      - name: Lint call service
        run: |
          flake8 niorlusx_call_service/app.py --max-line-length=127 --exit-zero

      - name: Lint ai-agents-project
        run: |
          flake8 ai-agents-project/src/ --max-line-length=127 --exit-zero